<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TenaPay — Sign In</title>
  <meta name="theme-color" content="#FAF7F1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <link rel="stylesheet" href="style.css">
 <style>

 </style>
</head>

<body>
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="landingpage.html" aria-label="Makazi Care home">
        <span class="brand-mark"><i class="bi bi-house-door" aria-hidden="true"></i></span>
        <span><span class="brand-name">MAKAZI CARE</span><span class="brand-sub">Rent, calmed</span></span>
      </a>
      <a class="back-link" href="landingpage.html"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Back to site</a>
    </div>
  </header>

  <main class="auth-main">
    <div class="container">
      <div class="auth-shell mx-auto">
        <aside class="welcome" aria-label="Welcome to TenaPay">
          <img src="https://images.pexels.com/photos/34270526/pexels-photo-34270526.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=1000"
               alt="Modern apartment balconies in warm light" />
          <div class="welcome-copy">
            <p class="welcome-kicker">Makazi Care portal</p>
            <h1>Welcome back <em>home.</em></h1>
            <p>One calm place for rent, property records, and the people who make a home.</p>
          </div>
        </aside>

        <section class="form-side" aria-labelledby="signInTitle">
          <div class="form-inner">
            <p class="form-kicker">Your Makazi Care account</p>
            <h2 class="form-title" id="signInTitle">Sign in</h2>
            <!-- <p class="form-intro">Enter your account details, then choose the portal you use.</p> -->

            <form id="loginForm" action="tenanthomepage.html" method="get">
              <div class="field">
                <label for="email">Email address</label>
                <input class="form-control" id="email" type="email" autocomplete="username" placeholder="you@example.com" required />
              </div>
              
              <div class="field">
                <label for="password">Password</label>
                <input class="form-control" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required />
              </div>

              <fieldset class="role-fieldset">
                <legend>Continue to</legend>
                <div class="role-options">
                  <div>
                    <input class="role-radio" type="radio" name="role" id="roleTenant" value="tenant" required />
                    <label class="role-card" for="roleTenant"><i class="bi bi-person" aria-hidden="true"></i>Tenant</label>
                  </div>
                  <div>
                    <input class="role-radio" type="radio" name="role" id="roleLandlord" value="landlord" />
                    <label class="role-card" for="roleLandlord"><i class="bi bi-house-heart" aria-hidden="true"></i>Landlord</label>
                  </div>
                  <div>
                    <input class="role-radio" type="radio" name="role" id="roleManager" value="manager" />
                    <label class="role-card" for="roleManager"><i class="bi bi-clipboard-check" aria-hidden="true"></i>Property manager</label>
                  </div>
                </div>
              </fieldset>

              <button class="route-button route-tenant btn btn-sage" type="submit" formaction="tenanthomepage.html" formmethod="get">
                Continue to tenant home <i class="bi bi-arrow-right" aria-hidden="true"></i>
              </button>
              <button class="route-button route-landlord btn btn-sage" type="submit" formaction="landlordhomepage.html" formmethod="get">
                Continue to landlord home <i class="bi bi-arrow-right" aria-hidden="true"></i>
              </button>
              <button class="route-button route-manager btn btn-sage" type="submit" formaction="propertymanager.html" formmethod="get">
                Continue to manager home <i class="bi bi-arrow-right" aria-hidden="true"></i>
              </button>

              <div class="form-help">
                <a href="mailto:hello@makazicare.com?subject=Password%20help">Forgot your password?</a>
                <a href="mailto:hello@makazicare.com?subject=Makazi%20Care%20account%20access">Need an account?</a>
              </div>
              <!-- <p class="private-note"><i class="bi bi-shield-lock" aria-hidden="true"></i><span>Your credentials are not sent to the demo portal. Connect authen2tication to verify accounts securely.</span></p> -->
              <!-- <p class="demo-note mb-0">Preview mode: valid form details route you to the selected home page. This page does not verify a real account.</p> -->
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>© 2026 Makazi Care</span>
      <span><a href="mailto:hello@makazicare.com">Need help signing in?</a></span>
    </div>
  </footer>
</body>
</html>
