<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose a new password — Makazi Care</title>
  <meta name="theme-color" content="#FAF7F1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="landingpage.html" aria-label="Makazi Care home">
        <span class="brand-mark"><i class="bi bi-house-door" aria-hidden="true"></i></span>
        <span><span class="brand-name">MAKAZI CARE</span><span class="brand-sub">Rent, calmed</span></span>
      </a>
      <a class="back-link" href="authpage.html">Back to sign in</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="container">
      <div class="auth-shell mx-auto">
        <aside class="welcome" aria-label="Makazi Care">
          <img src="https://images.pexels.com/photos/34270526/pexels-photo-34270526.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=1200&w=1000" alt="Modern apartment balconies" />
          <div class="welcome-copy"><p class="welcome-kicker">Account recovery</p><h1>A fresh <em>start.</em></h1><p>Choose a new password to secure your Makazi Care account.</p></div>
        </aside>
        <section class="form-side" aria-labelledby="newPasswordTitle">
          <div class="form-inner">
            <p class="form-kicker">Makazi Care account</p>
            <h1 class="form-title" id="newPasswordTitle">Choose a new password</h1>
            <p class="form-intro">Use at least 12 characters. This reset link can only be used once.</p>
            <form id="passwordResetForm">
              <div class="field">
                <label for="newPassword">New password</label>
                <input class="form-control" id="newPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
              </div>
              <div class="field">
                <label for="confirmPassword">Confirm new password</label>
                <input class="form-control" id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required />
              </div>
              <button class="btn btn-sage w-100 mt-3" type="submit">Reset password <i class="bi bi-arrow-right" aria-hidden="true"></i></button>
            </form>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="site-footer"><div class="container d-flex justify-content-between gap-2"><span>© 2026 Makazi Care</span><a href="authpage.html">Return to sign in</a></div></footer>
  <script src="app.js"></script>
</body>
</html>
