<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>Landlord registration · Makazi Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="landingpage.html"><span class="brand-mark"><i class="bi bi-house-door" aria-hidden="true"></i></span><span><span class="brand-name">MAKAZI CARE</span><span class="brand-sub">Rent, calmed</span></span></a>
      <a class="back-link" href="authpage.html">Already registered? Sign in</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="container">
      <section class="card-panel mx-auto" style="max-width: 34rem" aria-labelledby="registerTitle">
        <p class="form-kicker">Landlord account</p>
        <h1 class="form-title" id="registerTitle">Create your account</h1>
        <p class="form-intro">After registration, you can add properties and invite your managers and tenants.</p>
        <form id="landlordRegisterForm" class="d-grid gap-3">
          <label for="registerName">Full name</label>
          <input class="form-control" id="registerName" name="name" autocomplete="name" required>
          <label for="registerEmail">Email address</label>
          <input class="form-control" id="registerEmail" name="email" type="email" autocomplete="email" required>
          <label for="registerPassword">Password <span class="small text-muted">(at least 12 characters)</span></label>
          <input class="form-control" id="registerPassword" name="password" type="password" minlength="12" autocomplete="new-password" required>
          <label for="registerPasswordConfirm">Confirm password</label>
          <input class="form-control" id="registerPasswordConfirm" name="passwordConfirm" type="password" minlength="12" autocomplete="new-password" required>
          <button class="btn btn-sage" type="submit">Create landlord account</button>
        </form>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
