<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>Property manager listing · Makazi Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="landingpage.html"><span class="brand-mark"><i class="bi bi-buildings" aria-hidden="true"></i></span><span><span class="brand-name">MAKAZI CARE</span><span class="brand-sub">Property managers</span></span></a>
      <a class="back-link" href="authpage.html">Already registered? Sign in</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="container">
      <section class="card-panel mx-auto" style="max-width: 48rem" aria-labelledby="managerRegisterTitle">
        <p class="form-kicker">Manager marketplace</p>
        <h1 class="form-title" id="managerRegisterTitle">Create your manager listing</h1>
        <p class="form-intro">Show landlords what you manage, what you are good at, and where you work. You can edit or hide your listing later.</p>
        <form id="managerRegisterForm" class="d-grid gap-3">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="managerName">Full name</label><input class="form-control" id="managerName" name="name" autocomplete="name" required></div>
            <div class="col-md-6"><label class="form-label" for="managerEmail">Email address</label><input class="form-control" id="managerEmail" name="email" type="email" autocomplete="email" required></div>
            <div class="col-md-6"><label class="form-label" for="managerPassword">Password <span class="small text-muted">(at least 12 characters)</span></label><input class="form-control" id="managerPassword" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
            <div class="col-md-6"><label class="form-label" for="managerPasswordConfirm">Confirm password</label><input class="form-control" id="managerPasswordConfirm" name="passwordConfirm" type="password" minlength="12" autocomplete="new-password" required></div>
          </div>
          <div><label class="form-label" for="managerHeadline">Professional headline</label><input class="form-control" id="managerHeadline" name="headline" maxlength="100" placeholder="e.g. Residential property manager · 6 years" required></div>
          <div><label class="form-label" for="managerBio">About your experience</label><textarea class="form-control" id="managerBio" name="bio" rows="4" minlength="30" maxlength="1000" placeholder="Describe your experience and how you work with landlords and tenants." required></textarea></div>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label" for="managerExperience">Years of experience</label><input class="form-control" id="managerExperience" name="experienceYears" type="number" min="0" max="60" step="1" value="0" required></div>
            <div class="col-md-6"><label class="form-label" for="managerAreas">Service areas</label><input class="form-control" id="managerAreas" name="serviceAreas" placeholder="Nairobi, Kiambu" required><small class="text-muted">Separate areas with commas.</small></div>
          </div>
          <fieldset>
            <legend class="form-label">Skills you offer</legend>
            <div class="d-flex flex-wrap gap-3">
              <label><input type="checkbox" name="managerSkill" value="Tenant screening"> Tenant screening</label>
              <label><input type="checkbox" name="managerSkill" value="Leasing and renewals"> Leasing and renewals</label>
              <label><input type="checkbox" name="managerSkill" value="Rent collection"> Rent collection</label>
              <label><input type="checkbox" name="managerSkill" value="Maintenance coordination"> Maintenance coordination</label>
              <label><input type="checkbox" name="managerSkill" value="Inspections"> Inspections</label>
              <label><input type="checkbox" name="managerSkill" value="Move-in and move-out"> Move-in and move-out</label>
              <label><input type="checkbox" name="managerSkill" value="Bookkeeping and reporting"> Bookkeeping and reporting</label>
            </div>
          </fieldset>
          <fieldset>
            <legend class="form-label">Property types you manage</legend>
            <div class="d-flex flex-wrap gap-3">
              <label><input type="checkbox" name="managerPropertyType" value="Apartments"> Apartments</label>
              <label><input type="checkbox" name="managerPropertyType" value="Houses"> Houses</label>
              <label><input type="checkbox" name="managerPropertyType" value="Commercial"> Commercial</label>
              <label><input type="checkbox" name="managerPropertyType" value="Short-term rentals"> Short-term rentals</label>
            </div>
          </fieldset>
          <label class="form-check"><input class="form-check-input" id="managerListed" type="checkbox" checked><span class="form-check-label">Show my profile in the landlord directory</span></label>
          <button class="btn btn-sage" type="submit">Create profile and account</button>
        </form>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
