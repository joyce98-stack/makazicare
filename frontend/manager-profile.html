<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>My manager listing · Makazi Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg sticky-top"><div class="container">
    <a class="navbar-brand d-flex align-items-center gap-2" href="propertymanager.html"><span class="brand-mark"><i class="bi bi-buildings" aria-hidden="true"></i></span><span><span class="brand-name d-block">MAKAZI CARE</span><span class="brand-sub d-block">Manager listing</span></span></a>
    <div class="navbar-collapse show"><a class="nav-link" href="propertymanager.html"><i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Manager desk</a></div>
  </div></nav>
  <main class="page"><div class="container">
    <section class="card-panel mx-auto" style="max-width: 48rem">
      <p class="form-kicker">Manager marketplace</p>
      <h1 class="form-title">My public listing</h1>
      <p class="form-intro">Keep your experience and service details current. Turn off your listing whenever you are unavailable.</p>
      <form id="managerProfileForm" class="d-grid gap-3">
        <div><label class="form-label" for="profileHeadline">Professional headline</label><input class="form-control" id="profileHeadline" name="headline" maxlength="100" required></div>
        <div><label class="form-label" for="profileBio">About your experience</label><textarea class="form-control" id="profileBio" name="bio" rows="4" minlength="30" maxlength="1000" required></textarea></div>
        <div class="row g-3"><div class="col-md-6"><label class="form-label" for="profileExperience">Years of experience</label><input class="form-control" id="profileExperience" name="experienceYears" type="number" min="0" max="60" step="1" required></div><div class="col-md-6"><label class="form-label" for="profileAreas">Service areas</label><input class="form-control" id="profileAreas" name="serviceAreas" required><small class="text-muted">Separate areas with commas.</small></div></div>
        <fieldset><legend class="form-label">Skills you offer</legend><div class="d-flex flex-wrap gap-3">
          <label><input type="checkbox" name="managerSkill" value="Tenant screening"> Tenant screening</label><label><input type="checkbox" name="managerSkill" value="Leasing and renewals"> Leasing and renewals</label><label><input type="checkbox" name="managerSkill" value="Rent collection"> Rent collection</label><label><input type="checkbox" name="managerSkill" value="Maintenance coordination"> Maintenance coordination</label><label><input type="checkbox" name="managerSkill" value="Inspections"> Inspections</label><label><input type="checkbox" name="managerSkill" value="Move-in and move-out"> Move-in and move-out</label><label><input type="checkbox" name="managerSkill" value="Bookkeeping and reporting"> Bookkeeping and reporting</label>
        </div></fieldset>
        <fieldset><legend class="form-label">Property types you manage</legend><div class="d-flex flex-wrap gap-3">
          <label><input type="checkbox" name="managerPropertyType" value="Apartments"> Apartments</label><label><input type="checkbox" name="managerPropertyType" value="Houses"> Houses</label><label><input type="checkbox" name="managerPropertyType" value="Commercial"> Commercial</label><label><input type="checkbox" name="managerPropertyType" value="Short-term rentals"> Short-term rentals</label>
        </div></fieldset>
        <label class="form-check"><input class="form-check-input" id="profileListed" type="checkbox"><span class="form-check-label">Show my profile in the landlord directory</span></label>
        <button class="btn btn-sage" type="submit">Save listing</button>
      </form>
    </section>
  </div></main>
  <script src="app.js"></script>
</body>
</html>
