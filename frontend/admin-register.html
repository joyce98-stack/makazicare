<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FAF7F1">
  <title>System admin registration · Makazi Care</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..650;1,9..144,400..650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a class="brand" href="landingpage.html"><span class="brand-mark"><i class="bi bi-shield-lock" aria-hidden="true"></i></span><span><span class="brand-name">MAKAZI CARE</span><span class="brand-sub">System administration</span></span></a>
      <a class="back-link" href="authpage.html">Back to sign in</a>
    </div>
  </header>
  <main class="auth-main">
    <div class="container">
      <section class="card-panel mx-auto" style="max-width: 42rem" aria-labelledby="adminRegisterTitle">
        <p class="form-kicker">System access</p>
        <h1 class="form-title" id="adminRegisterTitle">Register a system admin</h1>
        <p class="form-intro">Verify an existing system admin account, then set up the new administrator.</p>
        <form id="adminRegistrationForm" class="d-grid gap-3">
          <h2 class="h5 mb-0">Verify current admin</h2>
          <div><label class="form-label" for="currentAdminEmail">Admin email</label><input class="form-control" id="currentAdminEmail" name="currentAdminEmail" type="email" autocomplete="username" required></div>
          <div><label class="form-label" for="currentAdminPassword">Admin password</label><input class="form-control" id="currentAdminPassword" name="currentAdminPassword" type="password" autocomplete="current-password" required></div>
          <hr>
          <h2 class="h5 mb-0">New admin account</h2>
          <div><label class="form-label" for="newAdminName">Full name</label><input class="form-control" id="newAdminName" name="name" autocomplete="name" required></div>
          <div><label class="form-label" for="newAdminEmail">Email address</label><input class="form-control" id="newAdminEmail" name="email" type="email" autocomplete="email" required></div>
          <div><label class="form-label" for="newAdminPassword">Password (at least 12 characters)</label><input class="form-control" id="newAdminPassword" name="password" type="password" minlength="12" autocomplete="new-password" required></div>
          <div><label class="form-label" for="newAdminPasswordConfirm">Confirm new password</label><input class="form-control" id="newAdminPasswordConfirm" name="passwordConfirm" type="password" minlength="12" autocomplete="new-password" required></div>
          <button class="btn btn-sage" type="submit">Create system admin account</button>
        </form>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
