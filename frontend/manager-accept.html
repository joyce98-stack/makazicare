<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accept manager invitation · Makazi Care</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-5" style="max-width: 36rem">
    <h1 class="mb-3">Set up your manager account</h1>
    <p>Choose a password with at least 10 characters to accept your invitation.</p>
    <form id="managerAcceptForm" class="card card-body gap-3">
      <label for="managerPassword" class="form-label">New password</label>
      <input id="managerPassword" class="form-control" type="password" minlength="10" autocomplete="new-password" required>
      <label for="managerPasswordConfirm" class="form-label">Confirm password</label>
      <input id="managerPasswordConfirm" class="form-control" type="password" minlength="10" autocomplete="new-password" required>
      <button class="btn btn-sage" type="submit">Accept invitation</button>
    </form>
    <p id="managerAcceptMessage" class="mt-3" role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
